<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="canvas" content="1080x1350">
<title>Cartão social 4:5 — Rede Sesc de Educação</title>
<link rel="stylesheet" href="../../../../styles.css">
<link rel="stylesheet" href="exemplar.css">
<style>
  html, body { margin: 0; background: var(--rse-brand-gray-200); }
  .slide.fmt-social45 { --S: 1080px; --m: calc(var(--S) * .08); }
</style>
</head>
<body>

<section class="slide fmt-social45 hue-orange" data-slide data-archetype="ask">

  <img class="motif" src="../../../../assets/motifs/cube-hollow.svg" alt="" style="left:540px;top:870px;width:760px">
  <div class="at" style="--x:.08;--y:.25;--w:.84">
    <h1 class="h1">Venha conhecer a nossa escola</h1>
  </div>
  <div class="at" style="--x:.08;--y:.66;--w:.6">
    <p class="h2">Sábado, 00/00</p>
    <p class="body" style="margin-top:14px;width:calc(.4 * var(--W))">às 00h. Inscrições pelo link (exemplo).</p>
  </div>
</section>

</body>
</html>
