<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="canvas" content="1485x2100">
<title>Cartaz A3 — Rede Sesc de Educação</title>
<link rel="stylesheet" href="../../../../styles.css">
<link rel="stylesheet" href="exemplar.css">
<style>
  html, body { margin: 0; background: var(--rse-brand-gray-200); }
  .slide.fmt-a3 { --S: 1485px; --m: calc(var(--S) * .08); }
</style>
</head>
<body>

<section class="slide fmt-a3" data-slide data-archetype="cover">
  <img class="selo" src="../../../../assets/logos/wordmark-purple.svg" alt="Rede Sesc de Educação" style="left:var(--m);top:var(--m)">
  <img class="motif" src="../../../../assets/motifs/cube-cube.svg" alt="" style="left:690px;top:980px;width:1100px">
  <div class="at" style="--x:.08;--y:.19;--w:.84">
    <p class="eyebrow">Matrículas abertas</p>
    <h1 class="display">Aprender para a vida acontecer</h1>
  </div>
  <div class="fill" style="left:0;right:0;bottom:0;height:calc(.2 * var(--H));background:var(--rse-color-primary)"></div>
  <div class="at b" style="--x:.08;--y:.055;--w:.84;color:var(--rse-color-text-on-primary)">
    <p class="h2" style="color:var(--rse-color-text-on-primary)">Matrículas até 00/00</p>
    <p class="body" style="margin-top:18px;color:var(--rse-color-text-on-primary)">Endereço e telefone da unidade (exemplo)</p>
  </div>
</section>

</body>
</html>
