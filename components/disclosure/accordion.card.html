<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../dist/rse.js"></script></head>
<body style="margin:0;padding:32px;background:var(--rse-color-surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Accordion } = window.RSE;
const items = [
  { title: 'Quem pode se inscrever na Rede Sesc de Educação?', content: 'Trabalhadores do comércio de bens, serviços e turismo e seus dependentes têm prioridade e condições diferenciadas. As vagas restantes ficam abertas à comunidade em geral.' },
  { title: 'Quais documentos preciso levar na matrícula?', content: 'RG e CPF do aluno e do responsável, comprovante de residência, histórico escolar e, para a categoria trabalhador, a Credencial Sesc válida.' },
  { title: 'Como funciona o processo de seleção?', content: 'A inscrição é feita online, seguida de conferência de documentos na unidade. Quando há mais candidatos que vagas, a seleção segue os critérios publicados no edital de cada unidade.' },
  { title: 'A Rede oferece bolsas ou gratuidade?', content: 'Sim. Parte das vagas é destinada ao Programa de Comprometimento e Gratuidade, conforme regulamento nacional do Sesc.' }
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{maxWidth:640}}>
    <p style={{fontSize:'var(--rse-font-size-eyebrow)',textTransform:'uppercase',letterSpacing:'var(--rse-letter-spacing-eyebrow)',fontWeight:'var(--rse-font-weight-bold)',color:'var(--rse-color-text-muted)',marginBottom:'var(--rse-space-4)'}}>Perguntas frequentes</p>
    <Accordion items={items} defaultOpen={[0]} />
  </div>
);
</script>
</body></html>
