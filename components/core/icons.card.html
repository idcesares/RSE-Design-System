<!-- @dsCard group="Components" viewport="700x300" name="Icons" subtitle="Line-icon primitive — the single source of truth for iconography" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../dist/rse.js"></script></head>
<body style="margin:0;padding:24px;background:var(--rse-color-surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Icon, iconNames } = window.RSE;
function App(){
  return <div style={{fontFamily:'var(--rse-font-family)'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:12}}>
      {iconNames.map(n =>
        <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'14px 6px',background:'var(--rse-color-surface-card)',border:'1px solid var(--rse-color-border-subtle)',borderRadius:'var(--rse-radius-md)'}}>
          <span style={{color:'var(--rse-color-primary)'}}><Icon name={n} size={22} /></span>
          <span style={{fontSize:'11px',color:'var(--rse-color-text-muted)',fontFamily:'ui-monospace,monospace',textAlign:'center'}}>{n}</span>
        </div>
      )}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
