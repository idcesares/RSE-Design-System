<!DOCTYPE html><html lang="pt-BR"><head><title>Breadcrumb & Pagination — Rede Sesc de Educação</title><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../dist/rse.js"></script></head>
<body style="margin:0;padding:24px;background:var(--rse-color-surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Breadcrumb, Pagination } = window.RSE;
function App(){
  const [page, setPage] = React.useState(4);
  return <div style={{display:'flex',flexDirection:'column',gap:28,fontFamily:'var(--rse-font-family)'}}>
    <Breadcrumb items={[{label:'Início',href:'#'},{label:'Unidades',href:'#'},{label:'Sesc São Paulo'}]} />
    <Pagination page={page} totalPages={12} onChange={setPage} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
