<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;padding:32px;background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { DataTable, Stat, Badge, Tag } = window.RedeSescDeEducaODesignSystem_2167ce;
const columns = [
  { key: 'programa', label: 'Programa' },
  { key: 'nivel', label: 'Nível' },
  { key: 'turno', label: 'Turno' },
  { key: 'status', label: 'Status', align: 'right' }
];
const rows = [
  { programa: 'Ensino Médio integrado', nivel: <Tag color="green">Médio</Tag>, turno: 'Manhã', status: <Badge tone="success">Vagas abertas</Badge> },
  { programa: 'Ensino Fundamental II', nivel: <Tag color="orange">Fundamental</Tag>, turno: 'Manhã', status: <Badge tone="warning">Últimas vagas</Badge> },
  { programa: 'Educação Infantil', nivel: <Tag color="pink">Infantil</Tag>, turno: 'Integral', status: <Badge tone="danger">Encerrado</Badge> },
  { programa: 'Formação Profissional', nivel: <Tag color="blue">Técnico</Tag>, turno: 'Noite', status: <Badge tone="info">Novo</Badge> }
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',flexDirection:'column',gap:'var(--space-7)'}}>
    <DataTable caption="Turmas 2026 — Unidade Centro" columns={columns} rows={rows} />
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'var(--space-6)'}}>
      <Stat value="+1.200" label="Escolas e unidades" accent="primary" />
      <Stat value="97%" label="Famílias satisfeitas" accent="green" />
      <Stat value="26" label="Estados + DF" accent="orange" />
      <Stat value="70 anos" label="De tradição" accent="blue" />
    </div>
    <div style={{background:'var(--color-primary)',borderRadius:'var(--radius-lg)',padding:'var(--space-6)',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'var(--space-6)'}}>
      <Stat value="+38 mil" label="Estudantes por ano" accent="inverse" />
      <Stat value="4,2 mil" label="Educadores" accent="inverse" />
      <Stat value="100%" label="Cobertura nacional" accent="inverse" />
    </div>
  </div>
);
</script>
</body></html>
