<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../dist/rse.js"></script></head>
<body style="margin:0;padding:32px;background:var(--rse-color-surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Stepper, Textarea, Button } = window.RSE;
function App(){
  const [step, setStep] = React.useState(1);
  const [text, setText] = React.useState('Quero estudar no Sesc porque');
  const steps = [
    { label: 'Dados do aluno' },
    { label: 'Documentos', description: 'RG, CPF e comprovante' },
    { label: 'Revisão' },
    { label: 'Confirmação' }
  ];
  return <div style={{display:'flex',flexDirection:'column',gap:'var(--rse-space-7)',maxWidth:700}}>
    <Stepper steps={steps} current={step} onStepClick={setStep} />
    <div style={{background:'var(--rse-color-surface-card)',border:'1px solid var(--rse-color-border-subtle)',borderRadius:'var(--rse-radius-lg)',padding:'var(--rse-space-6)',display:'flex',flexDirection:'column',gap:'var(--rse-space-5)'}}>
      <Textarea label="Conte por que quer estudar na Rede Sesc" value={text} onChange={e=>setText(e.target.value)} maxLength={500} hint="Opcional — ajuda a equipe a conhecer você." rows={4} />
      <Textarea label="Observações de acessibilidade" error="Escreva ao menos 20 caracteres." rows={2} />
      <div style={{display:'flex',gap:'var(--rse-space-3)'}}>
        <Button variant="ghost" size="sm" onClick={()=>setStep(Math.max(0,step-1))}>Voltar</Button>
        <Button variant="primary" size="sm" onClick={()=>setStep(Math.min(steps.length-1,step+1))}>Continuar</Button>
      </div>
    </div>
    <div style={{maxWidth:260}}><Stepper steps={steps} current={2} orientation="vertical" /></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
