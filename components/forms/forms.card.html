<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;padding:24px;background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.RedeSescDeEducaODesignSystem_2167ce;
function App(){
  const [turno, setTurno] = React.useState('manha');
  return <div style={{display:'flex',flexDirection:'column',gap:18,maxWidth:340,fontFamily:'var(--font-family-base)'}}>
    <Input label="Nome completo" placeholder="Digite seu nome" />
    <Input label="E-mail" placeholder="voce@exemplo.com" error="E-mail inválido" />
    <Select label="Unidade" placeholder="Escolha uma unidade" options={[{label:'Sesc Vila Mariana',value:'vm'},{label:'Sesc Pompeia',value:'pp'}]} />
    <div style={{display:'flex',gap:20}}>
      <Radio name="turno" label="Manhã" checked={turno==='manha'} onChange={()=>setTurno('manha')} />
      <Radio name="turno" label="Tarde" checked={turno==='tarde'} onChange={()=>setTurno('tarde')} />
    </div>
    <Checkbox label="Aceito os termos de uso" checked={true} onChange={()=>{}} />
    <Switch label="Receber novidades por e-mail" checked={true} onChange={()=>{}} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
