<!DOCTYPE html><html lang="pt-BR"><head><title>Spacing Scale — Rede Sesc de Educação</title><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--rse-color-surface-page);font-family:var(--rse-font-family)">
<div style="display:flex;align-items:flex-end;gap:10px;height:120px">
<div style="width:24px;height:var(--rse-space-1);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-2);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-3);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-4);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-5);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-6);background:var(--rse-color-primary)"></div>
<div style="width:24px;height:var(--rse-space-7);background:var(--rse-color-primary)"></div>
</div>
<div style="display:flex;gap:10px;margin-top:8px;font-size:11px;color:var(--rse-color-text-muted)">
<span style="width:24px">4</span><span style="width:24px">8</span><span style="width:24px">12</span><span style="width:24px">16</span><span style="width:24px">24</span><span style="width:24px">32</span><span style="width:24px">48</span>
</div>
</body></html>
