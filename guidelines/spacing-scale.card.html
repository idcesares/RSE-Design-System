<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base scale, 9 steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-family-base)">
<div style="display:flex;align-items:flex-end;gap:10px;height:120px">
<div style="width:24px;height:var(--space-1);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-2);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-3);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-4);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-5);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-6);background:var(--color-primary)"></div>
<div style="width:24px;height:var(--space-7);background:var(--color-primary)"></div>
</div>
<div style="display:flex;gap:10px;margin-top:8px;font-size:11px;color:var(--text-muted)">
<span style="width:24px">4</span><span style="width:24px">8</span><span style="width:24px">12</span><span style="width:24px">16</span><span style="width:24px">24</span><span style="width:24px">32</span><span style="width:24px">48</span>
</div>
</body></html>
