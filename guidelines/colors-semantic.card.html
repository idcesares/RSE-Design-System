<!-- @dsCard group="Colors" viewport="700x110" name="Semantic" subtitle="Success, warning, danger, info — mapped to accent family darks" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-family-base);background:var(--surface-page)">
<div style="display:flex;gap:8px">
<div style="flex:1;height:60px;border-radius:8px;background:var(--success);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600">Success</div>
<div style="flex:1;height:60px;border-radius:8px;background:var(--warning);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600">Warning</div>
<div style="flex:1;height:60px;border-radius:8px;background:var(--danger);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600">Danger</div>
<div style="flex:1;height:60px;border-radius:8px;background:var(--info);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600">Info</div>
</div>
</body></html>
