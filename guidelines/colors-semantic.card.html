<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status in three roles: surface, -text for words, bare name for indicators" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row{display:flex;gap:8px}
.s{flex:1;border-radius:var(--radius-sm);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--text-body-sm)}
.s b{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--font-weight-semibold)}
.s i{width:8px;height:8px;border-radius:50%;flex:none}
.s code{font-size:var(--text-caption);color:var(--text-body)}
.note{margin:var(--space-3) 0 0;font-size:var(--text-caption);color:var(--text-muted)}
</style></head>
<body style="margin:0;padding:20px;font-family:var(--font-family-base);background:var(--surface-page)">
<div class="row">
<div class="s" style="background:var(--success-surface);color:var(--success-text)"><b><i style="background:var(--success)"></i>Sucesso</b><code>--success-text</code></div>
<div class="s" style="background:var(--warning-surface);color:var(--warning-text)"><b><i style="background:var(--warning-text)"></i>Atenção</b><code>--warning-text</code></div>
<div class="s" style="background:var(--danger-surface);color:var(--danger-text)"><b><i style="background:var(--danger)"></i>Erro</b><code>--danger-text</code></div>
<div class="s" style="background:var(--info-surface);color:var(--info-text)"><b><i style="background:var(--info)"></i>Informação</b><code>--info-text</code></div>
</div>
<p class="note">Words use <code>--*-text</code> (4.5:1+). Dots, borders and icons use the bare name (3:1). Never white text on a status colour.</p>
</body></html>
