<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Surfaces" subtitle="Cream page background, card surface, ink text, gray scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-family-base);background:var(--surface-page)">
<div style="display:flex;gap:8px;height:90px">
<div style="flex:1.4;background:var(--surface-page);border:1px solid var(--border-default);border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;color:var(--text-body)">surface-page<br>#f2f4e4</div>
<div style="flex:1.4;background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600">surface-card<br>#ffffff</div>
<div style="flex:1;background:var(--gray-300);border-radius:8px"></div>
<div style="flex:1;background:var(--gray-500);border-radius:8px"></div>
<div style="flex:1;background:var(--gray-700);border-radius:8px"></div>
<div style="flex:1.4;background:var(--color-ink);border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;color:white">ink (text)<br>#2b2a3d</div>
</div>
</body></html>
