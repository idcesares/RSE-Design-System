<!DOCTYPE html><html lang="pt-BR"><head><title>Neutrals & Surfaces — Rede Sesc de Educação</title><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--rse-font-family);background:var(--rse-color-surface-page)">
<div style="display:flex;gap:8px;height:90px">

<div style="flex:1;background:var(--rse-brand-gray-500);border-radius:8px"></div>
<div style="flex:1;background:var(--rse-brand-gray-700);border-radius:8px"></div>
<div style="flex:1.4;background:var(--rse-brand-ink);border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;color:white">ink (text)<br>#2b2a3d</div>
</div>
