<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>

<div style="display:flex;gap:0;border-radius:12px;overflow:hidden;height:90px">
<div style="flex:1;background:var(--color-purple-light);display:flex;align-items:flex-end;padding:8px;color:#3a3560;font-size:12px;font-weight:600">purple-light<br>#ad98ea</div>

<div style="flex:1;background:var(--color-purple-dark);display:flex;align-items:flex-end;padding:8px;color:white;font-size:12px;font-weight:600">purple-dark (primary)<br>#6c62c4</div>
<div style="flex:1;background:var(--color-indigo);display:flex;align-items:flex-end;padding:8px;color:white;font-size:12px;font-weight:600">indigo<br>#4c549e</div>
</div>
