<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--rse-color-surface-page);font-family:var(--rse-font-family)">
<div style="display:flex;gap:16;display:flex;gap:16px;align-items:center">
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-sm)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-md)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-lg)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-pill)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-md);box-shadow:var(--rse-shadow-sm)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-md);box-shadow:var(--rse-shadow-md)"></div>
<div style="width:56px;height:56px;background:var(--rse-color-surface-card);border-radius:var(--rse-radius-md);box-shadow:var(--rse-shadow-lg)"></div>
</div>
