<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-family-base)">
<div style="display:flex;gap:16;display:flex;gap:16px;align-items:center">
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-sm)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-md)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-lg)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-pill)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div>
<div style="width:56px;height:56px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div>
</div>
</body></html>
