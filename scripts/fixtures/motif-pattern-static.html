<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MotifPattern static fixture</title>
<link rel="stylesheet" href="/tokens/tokens.css">
<link rel="stylesheet" href="/tokens/base-runtime.css">
<link rel="stylesheet" href="/components/brand/MotifPattern.css">
<style>
  body { margin: 16px; background: var(--rse-color-surface-page) }
  .box { width: 480px; height: 270px; margin-bottom: 16px }
</style>
</head>
<body>
<!-- Plain HTML, no React: the markup MotifPattern.prompt.md documents, plus motion.js. -->
<div class="box" id="ambient-box" data-rse-motion="full">
  <div class="rse-motif-pattern rse-motion-managed" data-animate="ambient">
    <div class="rse-motif-pattern__art" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" preserveAspectRatio="xMidYMid slice" focusable="false">
        <g class="rse-motif-pattern__cells">
          <g class="rse-motif-pattern__cell" style="--d:0"><rect x="20" y="20" width="60" height="60" fill="#6c62c4"/></g>
          <g class="rse-motif-pattern__cell" style="--d:1"><rect x="120" y="20" width="60" height="60" fill="#6c62c4"/></g>
          <g class="rse-motif-pattern__cell" style="--d:2"><rect x="220" y="20" width="60" height="60" fill="#6c62c4"/></g>
        </g>
      </svg>
    </div>
    <button type="button" class="rse-motif-pattern__pause" aria-pressed="false" aria-label="Pausar animação">
      <span class="rse-motif-pattern__icon rse-motif-pattern__icon--pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg></span>
      <span class="rse-motif-pattern__icon rse-motif-pattern__icon--play"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></span>
    </button>
  </div>
</div>
<div class="box" data-rse-motion="full">
  <div class="rse-motif-pattern rse-motion-managed" id="reveal-pattern" data-animate="reveal">
    <div class="rse-motif-pattern__art" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" preserveAspectRatio="xMidYMid slice" focusable="false">
        <g class="rse-motif-pattern__cells">
          <g class="rse-motif-pattern__cell" style="--d:0"><rect x="20" y="20" width="60" height="60" fill="#6c62c4"/></g>
          <g class="rse-motif-pattern__cell" style="--d:3"><rect x="120" y="20" width="60" height="60" fill="#6c62c4"/></g>
        </g>
      </svg>
    </div>
  </div>
</div>
<script src="/motion.js"></script>
</body>
</html>
