<!doctype html>
<html lang="pt-BR" data-rse-motion="reduced">
<head>
<meta charset="utf-8">
<title>Motion nesting fixture</title>
<link rel="stylesheet" href="/tokens/base-runtime.css">
<style>
  @keyframes fx-slide { from { transform: translateX(0) } to { transform: translateX(100px) } }
  @keyframes fx-travel { from { transform: translateX(0) } to { transform: translateX(calc(100px * var(--rse-motion-travel))) } }
  .fx { width: 10px; height: 10px; animation: fx-slide 1s linear }
  .fx-managed { animation-name: fx-travel }
  html { scroll-behavior: smooth }
</style>
</head>
<body>
<div id="reduced-unmanaged" class="fx"></div>
<div id="reduced-managed" class="fx fx-managed rse-motion-managed"></div>
<section data-rse-motion="full">
  <div id="full-unmanaged" class="fx"></div>
</section>
</body>
</html>
