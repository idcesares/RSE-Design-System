<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Rede Sesc de Educação</title>
<link rel="stylesheet" href="../../styles.css">
<!-- Nothing here is fetched from a network. React is vendored, and the four screens come from
     _ds_bundle.js, which already mirrors them (in React.createElement form) and mounts App on
     #rede-sesc-site-root — the same route every template uses.

     This page used to load @babel/standalone from a CDN and compile ui_kits/site/*.jsx at
     runtime. Babel reads a `src` script over XHR, and a file:// page is not allowed to do that,
     so opening this file outside a web server produced a blank page. Do not reintroduce JSX or a
     CDN here: edit the sources beside this file and run `npm run sync`. -->
<script src="../../assets/vendor/react.production.min.js"></script>
<script src="../../assets/vendor/react-dom.production.min.js"></script>
<script src="../../image-slot.js"></script>
<style>body{margin:0}</style>
</head>
<body>
<div id="rede-sesc-site-root"></div>
<!-- After the mount point, not in <head>: the bundle's copy of app.js mounts on
     #rede-sesc-site-root as it evaluates, so the div has to exist by then. -->
<script src="../../_ds_bundle.js"></script>
</body></html>
